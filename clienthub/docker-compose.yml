name: clienthub

services:
  web:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  api:
    build: .
    image: clienthub-api:local
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-clienthub}
      DB_USER: ${DB_USER:-clienthub}
      DB_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    restart: "no"

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-clienthub}
      MYSQL_USER: ${DB_USER:-clienthub}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Définir MYSQL_ROOT_PASSWORD dans .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=tcp -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT COUNT(*) FROM clients' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - internal
    restart: "no"

volumes:
  mysql_data:

networks:
  internal:
    driver: bridge
