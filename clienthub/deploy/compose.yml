name: clienthub-8007
services:
  api:
    image: ${APP_IMAGE:?Image SHA requise}
    ports:
      - "8007:5000"
    environment:
      DB_HOST: db
      DB_NAME: clienthub
      DB_USER: clienthub
      DB_PASSWORD: ${DB_PASSWORD:?Mot de passe requis}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: clienthub
      MYSQL_USER: clienthub
      MYSQL_PASSWORD: ${DB_PASSWORD:?Mot de passe requis}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Mot de passe requis}
    volumes:
      - data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=tcp -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT COUNT(*) FROM clients' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
volumes:
  data:
