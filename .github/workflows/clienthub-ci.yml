name: ClientHub CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clienthub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clienthub
    env:
      COMPOSE_PROJECT_NAME: clienthub-ci
      DB_NAME: clienthub
      DB_USER: clienthub
      DB_PASSWORD: ci-clienthub-test-only
      MYSQL_ROOT_PASSWORD: ci-root-test-only
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances et exécuter les tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Vérifier la configuration Compose
        run: docker compose config --quiet
      - name: Construire l’image de l’API
        run: docker build --tag clienthub-api:local .
      - name: Vérifier le healthpoint de l’image
        run: |
          docker run -d --name clienthub-smoke -p 127.0.0.1:5001:5000 clienthub-api:local
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 2 --max-time 5 \
            --output "$RUNNER_TEMP/health.json" http://127.0.0.1:5001/health
          python -c 'import json, sys; assert json.load(open(sys.argv[1])) == {"status": "ok"}' "$RUNNER_TEMP/health.json"
      - name: Démarrer les services pour les tests d’intégration
        run: docker compose up -d --no-build --wait --wait-timeout 180
      - name: Tester l’API, MySQL et le portail Nginx
        run: python tests/check_http.py
      - name: Vérifier les paramètres de publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || secrets.DOCKERHUB_IMAGE }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo 'Secret DOCKERHUB_USERNAME manquant'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'Secret DOCKERHUB_TOKEN manquant'; exit 1; }
          test -n "$DOCKERHUB_IMAGE" || { echo 'Variable ou secret DOCKERHUB_IMAGE manquant (compte/clienthub)'; exit 1; }
      - name: Se connecter à Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publier l’image testée avec les tags SHA et latest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || secrets.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [[ "$DOCKERHUB_IMAGE" != */* ]]; then
            DOCKERHUB_IMAGE="$DOCKERHUB_USERNAME/$DOCKERHUB_IMAGE"
          fi
          docker tag clienthub-api:local "$DOCKERHUB_IMAGE:$GITHUB_SHA"
          docker tag clienthub-api:local "$DOCKERHUB_IMAGE:latest"
          docker push "$DOCKERHUB_IMAGE:$GITHUB_SHA"
          docker push "$DOCKERHUB_IMAGE:latest"
      - name: Afficher les diagnostics
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200
          docker logs clienthub-smoke 2>&1 || true
      - name: Nettoyer l’environnement CI
        if: always()
        run: |
          docker rm -f clienthub-smoke || true
          docker compose down --volumes --remove-orphans
